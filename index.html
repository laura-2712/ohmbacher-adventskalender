<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ohmbacher Adventskalender</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- Überschrift -->
        <header class="header">
            <h1>Ohmbacher Adventskalender</h1>
            <p>Gemeinsam durch die Weihnachtszeit</p>
        </header>


        <!-- Adventskalender -->
  <section class="kalender">

        </span>
    </button>

</section>

    </main>


    <!-- Popup -->
    <div class="popup-overlay" id="popup">

        <div class="popup">

            <button class="popup-schliessen" id="popupSchliessen">
                &times;
            </button>

            <div id="popupInhalt">
                <!-- Der Inhalt wird später mit JavaScript eingefügt -->
            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</html>
